name: Bug report
description: Something in koto is broken
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        If the same thing happens using miniaudio directly from C (audio that misbehaves, an assert
        or a crash inside the library), it belongs at
        [mackron/miniaudio](https://github.com/mackron/miniaudio/issues). Not sure? File it here.
  - type: dropdown
    id: platforms
    attributes:
      label: Platform(s)
      multiple: true
      options: [Android, iOS, JVM/Desktop, Web/JS, Web/Wasm, All]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: koto version
      placeholder: "0.1.0"
    validations: { required: true }
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got. A minimal test in the style of `kotlin/koto/src/commonTest` gets it fixed fastest.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Pasted as-is; no need for code fences.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and CPU, device or browser.
      placeholder: "Windows 11 x64, JDK 21"
